server:
  port: 8083

spring:
  application:
    name: feedback-service

  # Database configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/feedback
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

