databaseChangeLog:

  - changeSet:
      context: "!test"
      id: 1
      author: SENG Seyha
      changes:
        - sql: # Create the ENUM type for Role
            sql: "CREATE TYPE system_role_type AS ENUM ('SUPER_ADMIN', 'USER');"


  - changeSet:
      context: "test"
      id: 2
      author: SENG Seyha
      changes:
        - sql:
            sql: "CREATE TYPE IF NOT EXISTS system_role_type AS VARCHAR(20) CHECK (VALUE IN ('SUPER_ADMIN', 'USER'));"


  - changeSet:
      id: 3
      author: SENG Seyha
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: keycloak_id
                  type: varchar(255)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: profile_image_path
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: username
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(50)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: phone_number
                  type: varchar(50)
                  constraints:
                    unique: true
              - column:
                  name: address
                  type: varchar(100)
                  constraints:
                    nullable: true
              - column:
                  name: city
                  type: varchar(30)
                  constraints:
                    nullable: true
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: false

  - include:
      file: audit-columns.yaml
      relativeToChangelogFile: true
  - property:
      name: tableName
      value: users

  - changeSet:
      context: "!test"
      id: 4
      author: SENG Seyha
      changes:
        - createTable:
            tableName: system_roles
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: role
                  type: system_role_type


  - changeSet:
      context: "test"
      id: 5
      author: SENG Seyha
      changes:
        - createTable:
            tableName: system_roles
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: role
                  type: varchar(20)
                  constraints:
                    checkConstraint: "role IN ('SUPER_ADMIN', 'USER')"


  - changeSet:
      id: 6
      author: SENG Seyha
      changes:
        - insert:
            tableName: system_roles
            columns:
              - column:
                  name: role
                  value: 'SUPER_ADMIN'
        - insert:
            tableName: system_roles
            columns:
              - column:
                  name: role
                  value: 'USER'


  - changeSet:
      id: 7
      author: SENG Seyha
      changes:
        - createTable:
            tableName: users_system_roles
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_user_id
                    references: users(id)
              - column:
                  name: system_roles_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_system_roles_id
                    references: system_roles(id)

