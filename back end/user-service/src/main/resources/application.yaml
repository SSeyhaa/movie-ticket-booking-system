server:
  port: 8081
  servlet:
    context-path: /user-service

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true

logging:
  level:
    root: INFO
    com.legend: DEBUG

spring:
  application:
    name: user-service

  # Database configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/user-database
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

