server:
  port: ${USER_SERVICE_PORT}
  servlet:
    context-path: ${USER_SERVICE_CONTEXT_PATH}

eureka:
  client:
    serviceUrl:
      defaultZone: ${DISCOVERY_SERVICE_URL}
  instance:
    preferIpAddress: true

logging:
  level:
    root: INFO
    com.legend: DEBUG

spring:
  application:
    name: ${USER_SERVICE_NAME}

  # Database configuration
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${USER_SERVICE_DATABASE}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


app:
  keycloak:
    server-url: ${KEYCLOAK_URL}
    realm: ${KEYCLOAK_REALM}
    client-id: ${USER_SERVICE_KEYCLOAK_CLIENT_ID}
    client-secret: ${USER_SERVICE_KEYCLOAK_CLIENT_SECRET:ZhkWRhYC4JpmRVHIObMnFPxPWUVajkGR}
    email-super-admin: ${KEYCLOAK_EMAIL_SUPER_ADMIN}
    username-super-admin: ${KEYCLOAK_USERNAME_SUPER_ADMIN}
    password-super-admin: ${KEYCLOAK_PASSWORD_SUPER_ADMIN}
    first-name-super-admin: ${KEYCLOAK_FIRST_NAME_SUPER_ADMIN}
    last-name-super-admin: ${KEYCLOAK_LAST_NAME_SUPER_ADMIN}

