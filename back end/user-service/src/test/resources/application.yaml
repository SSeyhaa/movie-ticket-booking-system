spring:
  profiles:
    active: test
  application:
    name: user-service

  # Database configuration
  datasource:
    url: jdbc:h2:mem:db_name;DB_CLOSE_DELAY=-1;MODE=MySQL
    driverClassName: org.h2.Driver
    username: sa
    password: password

  # JPA configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    h2:
      console:
        enabled: true
  sql:
    mode: always
    init:
      platform: h2
      #      file SQL commands to create the database schema (like creating tables, defining relationships, etc.)
#      schema-locations: classpath:schema.sql
      #      file SQL commands to initialize data for the database (like inserting default values, test data, or lookup tables)
#      data-locations: classpath:data.sql

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    drop-first: true
    contexts: 'test'
