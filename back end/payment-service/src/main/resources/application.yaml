server:
  port: ${PAYMENT_SERVICE_PORT}
  servlet:
    context-path: ${PAYMENT_SERVICE_CONTEXT_PATH}

eureka:
  client:
    serviceUrl:
      defaultZone: ${DISCOVERY_SERVICE_URL}
  instance:
    preferIpAddress: true

spring:
  application:
    name: ${PAYMENT_SERVICE_NAME}

  # Database configuration
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${PAYMENT_SERVICE_DATABASE}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5 # minimum number of idle connections in the pool
      maximum-pool-size: 20 # maximum number of connections in the pool
      connection-timeout: 30000 # wait for a connection to become available from the pool.
      idle-timeout: 300000 # close and remove idle connections that greater than {minimum-idle} in the pool
      max-lifetime: 1800000 # restart the connection after this duration


  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

